# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: japan_address_code
title: 住所コード対応表
description: |-
  アドレス・ベース・レジストリの町字（lg_code と machiaza_id）と、国勢調査の小地域・郵便番号・3 次メッシュの対応表です。町字の形と、不動産取引の地区・ハローワークの管轄区域を地域コードに当てた対応表も収録しています。

  出典：「アドレス・ベース・レジストリ」（デジタル庁）、「国勢調査 町丁・字等別境界データ」（総務省統計局）、「登記所備付地図データ」（法務省）、「郵便番号データ」（日本郵便）、「不動産情報ライブラリ」（国土交通省）、「都道府県労働局所在地一覧」（厚生労働省）。Queria が加工したものです。
keywords:
  - 住所
  - 町字
  - 小地域
  - 対応表
  - 地域コード
  - 郵便番号
  - 不動産取引
  - ハローワーク
homepage: https://github.com/queria-io/dataset-japan-address-code
language: ja

