# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: japan_address_code
title: 住所コード対応表
description: |-
  アドレス・ベース・レジストリの町字（lg_code＋machiaza_id）と、国勢調査の小地域（KEY_CODE）などの地域コードの対応表。
  「アドレス・ベース・レジストリ」（デジタル庁）、「国勢調査 町丁・字等別境界データ」（総務省統計局）、「登記所備付地図データ」（法務省）を加工して作成。
  元にした Queria のデータセットは address_br・e_stat・moj。
keywords:
  - 住所
  - 町字
  - 小地域
  - 対応表
  - 地域コード
homepage: https://github.com/queria-io/dataset-japan-address-code
language: ja

licenses:
  - JP-DIGITAL-ADDRESS-BR
  - JP-GOV-STD-2.0
  - id: JP-MOJ-CHIZU
    url: https://www.moj.go.jp/MINJI/minji05_00494.html
    title: 登記所備付地図データ利用規約（法務省）

sources:
  - title: アドレス・ベース・レジストリ（デジタル庁）
    path: https://dataset.address-br.digital.go.jp/
  - title: 国勢調査 町丁・字等別境界データ（総務省統計局）
    path: https://www.e-stat.go.jp/gis
  - title: 登記所備付地図データ（法務省）
    path: https://www.moj.go.jp/MINJI/minji05_00494.html

contributors:
  - title: デジタル庁
    path: https://www.digital.go.jp/
    roles: [rightsHolder]
  - title: 総務省統計局
    path: https://www.stat.go.jp/
    roles: [rightsHolder]
  - title: 法務省
    path: https://www.moj.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: main
    title: メイン

annotations:
  queria:
    themes: [land_climate]
    cover: 🔗
    ai_context:
      instructions: |
        町字（address_br の lg_code, machiaza_id）と国勢調査の小地域（e_stat の key_code）をつなぐのに使う。
        town_small_area は町字と小地域の 1 組が 1 行。町字と小地域は 1 対 1 とは限らないので match_type を見る。
        按分するときは town_share（町字のうちこの小地域に入る割合）と small_area_share（小地域のうちこの町字に入る割合）を使い、
        空の行は割合が出せていない。town_shape は町字の形で、作り方は shape_method。
      synonyms: [住所 ID 対応表, 町字 小地域 対応, crosswalk]
      examples:
        - 町字ごとの人口を国勢調査の小地域から出したい
        - 住所の町字を小地域コードに変えたい
