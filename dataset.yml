spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: main
    title: メイン

annotations:
  queria:
    themes: [land_climate]
    cover: 🔗
    ai_context:
      instructions: |
        町字（address_br の lg_code, machiaza_id）と国勢調査の小地域（e_stat の key_code）をつなぐのに使う。
        town_small_area は町字と小地域の 1 組が 1 行。町字と小地域は 1 対 1 とは限らないので match_type を見る。
        按分するときは town_share（町字のうちこの小地域に入る割合）と small_area_share（小地域のうちこの町字に入る割合）を使い、
        空の行は割合が出せていない。town_shape は町字の形で、作り方は shape_method。
        town_postal_code は町字と郵便番号の 1 組が 1 行。1 つの町字に郵便番号が複数当たることがある。
        trade_district_small_area は不動産取引の地区（大字・町）と小地域の 1 組が 1 行。reinfolib の mart_trade_prices と
        municipality_code・district_name で結合すると、取引ごとに小地域コードが付く。1 つの地区は大字・町にかかる小地域すべてと組になる
        （取引がその中のどこかは判定できない）。oaza_count が 1 でない地区は大字・町が決まっていない。
        hellowork_city は市区町村ごとの管轄ハローワークで、1 行が市区町村×安定所。lg_code は 6 桁で、政令指定都市は区のコード。
        coverage = 'partial' は市区町村の一部だけを受け持つ行。安定所の所在地は mhlw.hellowork.office と
        prefecture_code・office_name・office_kind で結合する。
      synonyms: [住所 ID 対応表, 町字 小地域 対応, crosswalk, 取引 地区 小地域, 管轄ハローワーク, 公共職業安定所 管轄]
      examples:
        - 町字ごとの人口を国勢調査の小地域から出したい
        - 住所の町字を小地域コードに変えたい
        - 町字の郵便番号を知りたい
        - 不動産取引に小地域コードを付けたい
        - 市区町村を受け持つハローワークを知りたい
