name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 19 2 * *" # address_br の Sync（0 19 1 * *）の翌日に、その更新を受けて作り直す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: japan_address_code
      # 法務省の地図の筆（全国 1.1 億筆の形）を市区町村ごとに合わせる段がある。実測前の見込み
      timeout_minutes: 180
    secrets: inherit
