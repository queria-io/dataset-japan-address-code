schema: main
name: town_shape
title: 町字の形
description: |
  アドレス・ベース・レジストリの町字の形。公式の町字の形は無いので、国勢調査の小地域（令和2年）の形から作った。
  作り方は shape_method。小地域に町字が複数入る所と、名前で当たらない地番の地域はまだ入っていない。
  「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）と
  「国勢調査 町丁・字等別境界データ」（総務省統計局）（https://www.e-stat.go.jp/gis）を加工して作成。
keywords:
  - 町字
  - 境界
published: true
sources:
  - path: https://dataset.address-br.digital.go.jp/
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6桁（検査数字あり）"
    semantic: { role: entity, name: city }
  - name: machiaza_id
    title: 町字ID
    description: "7桁。lg_code との組で一意"
    semantic: { role: entity, name: town }
  - name: geometry
    title: 形
    description: "e_stat の small_area の形のまま（同じ測地系）"
  - name: shape_method
    title: 作り方
    description: "small_area（名前で 1 対 1 に当たる小地域の形）、parent_oaza（小字。同じ大字・町の形）"
