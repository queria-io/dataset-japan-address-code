schema: main
name: town_shape
title: 町字の形
description: |-
  町字の形です。公式の町字の形はないため、国勢調査の小地域と法務省の地図の筆の形から作っています。

  - 作り方は shape_method で分かれます
keywords:
  - 町字
  - 境界
sources:
  - path: https://dataset.address-br.digital.go.jp/
  - path: https://www.e-stat.go.jp/gis
  - path: https://www.moj.go.jp/MINJI/minji05_00494.html
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6 桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
    description: "7 桁。lg_code との組で一意"
    annotations: { queria: { semantic: { role: entity, name: town } } }
  - name: geometry
    title: 形
    description: "e_stat の small_area と同じ測地系"
  - name: shape_method
    title: 作り方
    description: "parcel・small_area・voronoi・parent_oaza（README を参照）"
  - name: parcel_share
    title: 筆の形の割合
    description: "形の面積のうち筆を合わせた形の割合（0〜1）"
