version: 2
models:
- name: town_shape
  description: 'アドレス・ベース・レジストリの町字の形。公式の町字の形は無いので、国勢調査の小地域（令和2年）の形から作った。

    小地域に町字が 1 つならその形、複数なら代表点のボロノイ図で切り分けた形。作り方は shape_method。

    「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）と

    「国勢調査 町丁・字等別境界データ」（総務省統計局）（https://www.e-stat.go.jp/gis）を加工して作成。

    '
  access: public
  columns:
  - name: lg_code
    data_type: varchar
  - name: machiaza_id
    data_type: varchar
  - name: geometry
    data_type: geometry
  - name: shape_method
    data_type: varchar
