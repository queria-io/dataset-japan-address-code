schema: main
name: town_small_area
title: 町字と小地域の対応
description: |-
  町字と国勢調査の小地域（令和2年）の対応です。1 行が町字と小地域の 1 組です。

  - 町字は lg_code と machiaza_id の組で一意です。machiaza_id だけで結合しないでください
  - 1 対 1 でない町字があります。match_type で対応の種類を確認してください
keywords:
  - 町字
  - 小地域
  - 対応表
sources:
  - path: https://dataset.address-br.digital.go.jp/
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6 桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
    description: "7 桁。lg_code との組で一意"
    annotations: { queria: { semantic: { role: entity, name: town } } }
  - name: key_code
    title: 小地域コード
    description: "国勢調査の KEY_CODE。当たる小地域がない町字は空"
    annotations: { queria: { semantic: { role: entity, name: small_area } } }
  - name: match_type
    title: 対応の種類
    description: "one_to_one・town_split・towns_merged・many_to_many"
  - name: town_share
    title: 町字のうちこの小地域に入る割合
    description: "0〜1。町字が 1 つの小地域にだけ当たるとき 1"
  - name: small_area_share
    title: 小地域のうちこの町字に入る割合
    description: "0〜1。one_to_one のとき 1。それ以外は空"
  - name: method
    title: 当て方
    description: "name（名前の一致）、point（代表点が入る小地域）"
  - name: point_mismatch
    title: 代表点の食い違い
    description: "名前で当たったが、代表点がこの小地域の外にあるとき true"
  - name: small_area_year
    title: 小地域の年
    description: "小地域の境界の国勢調査の年"
  - name: valid_from
    title: 町字の効力発生日
