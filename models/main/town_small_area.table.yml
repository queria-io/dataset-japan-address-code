schema: main
name: town_small_area
title: 町字と小地域の対応
description: |
  アドレス・ベース・レジストリの町字と、国勢調査の小地域（令和2年）の対応。1 行が町字と小地域の 1 組。
  同じ市区町村の中で名前が一致する小地域に当て、当たらない町字は代表点が入る小地域に当てた。
  「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）と
  「国勢調査 町丁・字等別境界データ」（総務省統計局）（https://www.e-stat.go.jp/gis）を加工して作成。
keywords:
  - 町字
  - 小地域
  - 対応表
sources:
  - path: https://dataset.address-br.digital.go.jp/
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
    description: "7桁。lg_code との組で一意"
    annotations: { queria: { semantic: { role: entity, name: town } } }
  - name: key_code
    title: 小地域コード
    description: "国勢調査の KEY_CODE（9桁または11桁）。当たる小地域が無い町字は空"
    annotations: { queria: { semantic: { role: entity, name: small_area } } }
  - name: match_type
    title: 対応の種類
    description: "one_to_one（互いに 1 つだけ）、town_split（町字が複数の小地域に分かれる）、towns_merged（複数の町字が 1 つの小地域に入る）、many_to_many（両方）"
  - name: town_share
    title: 町字のうちこの小地域に入る割合
    description: "0〜1。町字が 1 つの小地域にだけ当たるとき 1。それ以外は町字の形ができるまで空"
  - name: small_area_share
    title: 小地域のうちこの町字に入る割合
    description: "0〜1。one_to_one のとき 1。それ以外は空"
  - name: method
    title: 当て方
    description: "name（名前の一致）、point（町字の代表点が入る小地域）。代表点の無い小字は大字・町の代表点を使う"
  - name: point_mismatch
    title: 代表点の食い違い
    description: "true は名前で当たったが、町字の代表点がこの小地域の外にあるもの"
  - name: small_area_year
    title: 小地域の年
    description: "小地域の境界の国勢調査の年"
  - name: valid_from
    title: 町字の効力発生日
