schema: main
name: aza_shape
title: 法務省の地図の字の形
description: |-
  登記所備付地図の筆の形を、大字・丁目・小字の名前ごとに合わせた形です。1 行が 1 つの大字・丁目・小字です。

  - 形を持つ筆だけを合わせるため、任意座標系の図面が多い地域では形が欠けます
  - 登記のない道路や水路は、穴やすき間として残ります
keywords:
  - 地番
  - 筆
  - 境界
sources:
  - path: https://www.moj.go.jp/MINJI/minji05_00494.html
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6 桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: oaza
    title: 大字名
    description: 原典のまま
  - name: chome
    title: 丁目名
    description: 原典のまま全角数字（「３丁目」）
  - name: koaza
    title: 小字名
  - name: parcels
    title: 筆の数
    description: 合わせた筆の数
  - name: geometry
    title: 形
    description: 筆の形を合わせた形（経緯度 JGD2011）
  - name: moj_version
    title: 元にした moj のバージョン
    description: 合わせたときの moj のバージョン
