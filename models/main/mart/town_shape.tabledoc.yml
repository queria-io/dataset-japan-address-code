$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 町字の形
description: |-
  町字の形です。公式の町字の形はないため、国勢調査の小地域と法務省の地図の筆の形から作っています。

  - 作り方は shape_method で分かれます
topics:
  - 町字
  - 境界
sources: [dataset, gis, minji05_00494]
columns:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6 桁（検査数字あり）"
    entity: city
  - name: machiaza_id
    title: 町字ID
    description: "7 桁。lg_code との組で一意"
    entity: town
  - name: geometry
    title: 形
    description: "e_stat の small_area と同じ測地系"
  - name: shape_method
    title: 作り方
    description: "parcel・small_area・voronoi・parent_oaza（データセットの説明を参照）"
  - name: parcel_share
    title: 筆の形の割合
    description: "形の面積のうち筆を合わせた形の割合（0〜1）"
