$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 町字と郵便番号の対応
description: |-
  町字と郵便番号の対応です。1 行が町字と郵便番号の 1 組です。

  - 町域が丁目や番地で分かれている所では、1 つの町字に郵便番号が複数当たります
  - ビルの階ごとの郵便番号は入っていません
topics:
  - 町字
  - 郵便番号
  - 対応表
sources: [dataset, download]
columns:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6 桁（検査数字あり）"
    entity: {type: foreign, name: city}
  - name: machiaza_id
    title: 町字ID
    description: "7 桁。lg_code との組で一意"
    entity: {type: foreign, name: town}
  - name: zipcode
    title: 郵便番号
    description: "7 桁（ハイフンなし）"
    entity: {type: foreign, name: postal_code}
  - name: match_type
    title: 当て方
    description: "abr・name・prefix・sub・city（データセットの説明を参照）"
